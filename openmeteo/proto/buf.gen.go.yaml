version: v2
plugins:
  - protoc_builtin: go
    out: ..
    opt:
      - paths=import
      - module=github.com/jim-technologies/invariantaf/openmeteo
      - Mopenmeteo/v1/openmeteo.proto=github.com/jim-technologies/invariantaf/openmeteo/proto/openmeteo/v1;openmeteov1
  - local: protoc-gen-go-grpc
    out: ..
    opt:
      - paths=import
      - module=github.com/jim-technologies/invariantaf/openmeteo
      - Mopenmeteo/v1/openmeteo.proto=github.com/jim-technologies/invariantaf/openmeteo/proto/openmeteo/v1;openmeteov1
      - require_unimplemented_servers=false
