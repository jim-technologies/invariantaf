version: v2
plugins:
  - protoc_builtin: go
    out: ..
    opt:
      - paths=import
      - module=github.com/jim-technologies/invariantaf/discord
      - Mdiscord/v1/discord.proto=github.com/jim-technologies/invariantaf/discord/proto/discord/v1;discordv1
  - local: protoc-gen-go-grpc
    out: ..
    opt:
      - paths=import
      - module=github.com/jim-technologies/invariantaf/discord
      - Mdiscord/v1/discord.proto=github.com/jim-technologies/invariantaf/discord/proto/discord/v1;discordv1
      - require_unimplemented_servers=false
