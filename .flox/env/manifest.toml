schema-version = "1.11.0"


## Install Packages --------------------------------------------------
##  $ flox install gum  <- puts a package in [install] section below
##  $ flox search gum   <- search for a package
##  $ flox show gum     <- show all versions of a package
## -------------------------------------------------------------------
[install]
python3 = { pkg-path = "python314", version = "python3-3.14.7", pkg-group = "python" }
buf = { pkg-path = "buf", version = "1.72.0", pkg-group = "buf" }
protobuf = { pkg-path = "protobuf", version = "36.1", pkg-group = "protobuf" }
uv.pkg-path = "uv"
ruff.pkg-path = "ruff"
# Flox supplies the exact patched Go release every adapter module declares, so
# nothing downloads a toolchain at run time. The catalog's 1.27 line is its own
# package, resolved in its own group.
go = { pkg-path = "go_1_27", version = "1.27.2", pkg-group = "go" }
protoc-gen-go = { pkg-path = "protoc-gen-go", version = "1.36.12", pkg-group = "proto-go" }
protoc-gen-go-grpc = { pkg-path = "protoc-gen-go-grpc", version = "1.6.2", pkg-group = "proto-grpc" }
govulncheck = { pkg-path = "govulncheck", pkg-group = "repo-audit" }
gcc.pkg-path = "gcc"
gcc.outputs = "all"
# gum.pkg-path = "gum"
# gum.version = "^0.14.5"


## Environment Variables ---------------------------------------------
##  ... available for use in the activated environment
##      as well as [hook], [profile] scripts and [services] below.
## -------------------------------------------------------------------
[vars]
GOENV = "off"


## Activation Hook ---------------------------------------------------
##  ... run by _bash_ shell when you run 'flox activate'.
## -------------------------------------------------------------------
[hook]
on-activate = '''
  export UV_PYTHON="$(command -v python3.14)"
  export LIBSTDCPP_DIR="$(dirname "$(gcc --print-file-name=libstdc++.so.6)")"
  export LD_LIBRARY_PATH="$LIBSTDCPP_DIR${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
'''


## Profile script ----------------------------------------------------
## ... sourced by _your shell_ when you run 'flox activate'.
## -------------------------------------------------------------------
[profile]
# common = '''
#   gum style \
#   --foreground 212 --border-foreground 212 --border double \
#   --align center --width 50 --margin "1 2" --padding "2 4" \
#     $INTRO_MESSAGE
# '''
## Shell-specific customizations such as setting aliases go here:
# bash = ...
# zsh  = ...
# fish = ...


## Services ---------------------------------------------------------
##  $ flox services start             <- Starts all services
##  $ flox services status            <- Status of running services
##  $ flox activate --start-services  <- Activates & starts all
## ------------------------------------------------------------------
[services]
# myservice.command = "python3 -m http.server"


## Include ----------------------------------------------------------
## ... environments to create a composed environment
## ------------------------------------------------------------------
[include]
# environments = [
#     { dir = "../common" }
# ]


## Build and publish your own packages ------------------------------
##  $ flox build
##  $ flox publish
## ------------------------------------------------------------------
[build]
