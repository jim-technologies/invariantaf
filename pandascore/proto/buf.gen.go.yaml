version: v2
plugins:
  - protoc_builtin: go
    out: ..
    opt:
      - paths=import
      - module=github.com/jim-technologies/invariantaf/pandascore
      - Mpandascore/v1/pandascore.proto=github.com/jim-technologies/invariantaf/pandascore/proto/pandascore/v1;pandascorev1
  - local: protoc-gen-go-grpc
    out: ..
    opt:
      - paths=import
      - module=github.com/jim-technologies/invariantaf/pandascore
      - Mpandascore/v1/pandascore.proto=github.com/jim-technologies/invariantaf/pandascore/proto/pandascore/v1;pandascorev1
      - require_unimplemented_servers=false
