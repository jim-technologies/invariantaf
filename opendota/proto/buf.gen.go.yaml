version: v2
plugins:
  - protoc_builtin: go
    out: ..
    opt:
      - paths=import
      - module=github.com/jim-technologies/invariantaf/opendota
      - Mopendota/v1/opendota.proto=github.com/jim-technologies/invariantaf/opendota/proto/opendota/v1;opendotav1
  - local: protoc-gen-go-grpc
    out: ..
    opt:
      - paths=import
      - module=github.com/jim-technologies/invariantaf/opendota
      - Mopendota/v1/opendota.proto=github.com/jim-technologies/invariantaf/opendota/proto/opendota/v1;opendotav1
      - require_unimplemented_servers=false
