version: v2
plugins:
  - protoc_builtin: go
    out: ..
    opt:
      - paths=import
      - module=github.com/jim-technologies/invariantaf/telegram
      - Mtelegram/v1/telegram.proto=github.com/jim-technologies/invariantaf/telegram/proto/telegram/v1;telegramv1
  - local: protoc-gen-go-grpc
    out: ..
    opt:
      - paths=import
      - module=github.com/jim-technologies/invariantaf/telegram
      - Mtelegram/v1/telegram.proto=github.com/jim-technologies/invariantaf/telegram/proto/telegram/v1;telegramv1
      - require_unimplemented_servers=false
