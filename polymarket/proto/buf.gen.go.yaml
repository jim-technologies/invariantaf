version: v2
plugins:
  - protoc_builtin: go
    out: ..
    opt:
      - paths=import
      - module=github.com/jim-technologies/invariantaf/polymarket
      - Mpolymarket/v1/polymarket.proto=github.com/jim-technologies/invariantaf/polymarket/proto/polymarket/v1;polymarketv1
  - local: protoc-gen-go-grpc
    out: ..
    opt:
      - paths=import
      - module=github.com/jim-technologies/invariantaf/polymarket
      - Mpolymarket/v1/polymarket.proto=github.com/jim-technologies/invariantaf/polymarket/proto/polymarket/v1;polymarketv1
      - require_unimplemented_servers=false
