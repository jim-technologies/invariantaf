version: v2
plugins:
  - protoc_builtin: go
    out: ..
    opt:
      - paths=import
      - module=github.com/jim-technologies/invariantaf/predictfun
  - local: protoc-gen-go-grpc
    out: ..
    opt:
      - paths=import
      - module=github.com/jim-technologies/invariantaf/predictfun
      - require_unimplemented_servers=false
